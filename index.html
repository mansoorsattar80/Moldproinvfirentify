<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <title>Inventory Ledger</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
        :root { --primary-color: #2c3e50; --secondary-color: #3498db; --success-color: #27ae60; --warning-color: #e67e22; --danger-color: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f1f5f9; color: #334155; margin: 0; padding: 10px; text-transform: uppercase; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .nav-tabs { display: flex; background: #e2e8f0; border-radius: 8px; padding: 4px; margin-bottom: 15px; gap: 4px; }
        .nav-tab { flex: 1; padding: 8px 10px; text-align: center; background: transparent; border: none; border-radius: 6px; font-weight: 600; font-size: 12px; color: #475569; cursor: pointer; text-decoration: none; display: block; }
        .nav-tab.active { background: white; color: var(--primary-color); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .user-bar { display: flex; justify-content: space-between; background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; font-weight: 600; }
        h2 { color: var(--primary-color); text-align: center; margin-bottom: 5px; font-size: 20px; }
        .section-title { font-size: 15px; font-weight: 600; color: var(--primary-color); margin-top: 10px; margin-bottom: 10px; border-bottom: 2px solid var(--secondary-color); padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #475569; }
        input, select { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; width: 100%; box-sizing: border-box; background: #fff; text-transform: uppercase; }
        .table-container { overflow-x: auto; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 13px; }
        th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: center; }
        th { background-color: var(--primary-color); color: white; font-weight: 500; }
        .btn-container { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 20px; }
        button { background-color: var(--secondary-color); color: white; border: none; padding: 10px 14px; font-size: 13px; font-weight: 600; border-radius: 6px; cursor: pointer; text-transform: uppercase; }
        button.btn-success { background-color: var(--success-color); }
        button.btn-warning { background-color: var(--warning-color); }
        button.btn-danger { background-color: var(--danger-color); }
        .action-btn { background-color: var(--secondary-color); padding: 4px 8px; font-size: 11px; border-radius: 4px; }
  </style>
 </head>
 <body>
  <div class="container">
   <div class="user-bar">
    <span id="loggedInUserDisplay">👤 USER: MANSOOR</span>
    <span style="color: var(--success-color);">🟢 CLOUD CONNECTED</span>
   </div>
   <h2>Raw Material Inventory Ledger</h2>
   
   <!-- Multi-Page Links Navbar -->
   <div class="nav-tabs">
    <a href="index.html" class="nav-tab active">1. Inventory</a>
    <a href="specs.html" class="nav-tab">2. Job Specs & Cards</a>
    <a href="billing.html" class="nav-tab">3. Billing Summary</a>
    <a href="production.html" class="nav-tab">4. Daily Production</a>
   </div>

   <div class="section-title">
    <span>Inventory Stock Control</span>
    <div style="display: flex; gap: 6px;">
     <button type="button" class="btn-success" style="padding: 6px 10px; font-size: 12px;" onclick="addNewMaterialType()">+ Add New Material</button>
     <button type="button" class="btn-warning" style="padding: 6px 10px; font-size: 12px;" onclick="openPurchaseModal()">+ Purchase</button>
    </div>
   </div>
   
   <div class="form-grid" style="align-items: flex-end;">
    <div class="input-group"><label>From Date</label><input type="date" id="stockFromDate" onchange="renderInventory()"></div>
    <div class="input-group"><label>To Date</label><input type="date" id="stockToDate" onchange="renderInventory()"></div>
    <div class="input-group"><button type="button" class="action-btn" style="height: 35px;" onclick="recallDates()">🔄 Recall Dates</button></div>
   </div>

   <div class="table-container">
    <table>
     <thead>
      <tr>
       <th>Material</th>
       <th>Opening Stock</th>
       <th>Purchase</th>
       <th>Consume</th>
       <th>Closing Balance</th>
       <th>Action</th>
      </tr>
     </thead>
     <tbody id="inventoryTableBody"></tbody>
    </table>
   </div>

   <div class="btn-container">
    <a href="specs.html"><button>Next: Job Specs &rarr;</button></a>
   </div>
  </div>

  <script>
    const firebaseConfig = { apiKey: "AIzaSyDummyKey", authDomain: "moulding.firebaseapp.com", projectId: "moulding" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let inventoryData = { "PURE PP": { opening: 500, purchased: 200 } };
    let transactions = [];

    db.collection("mouldingApp").doc("mainData").onSnapshot((doc) => {
        if (doc.exists) {
            let data = doc.data();
            if (data.inventoryData) inventoryData = data.inventoryData;
            if (data.transactions) transactions = data.transactions;
            renderInventory();
        }
    });

    function recallDates() {
        let today = new Date();
        document.getElementById('stockFromDate').value = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split('T')[0];
        document.getElementById('stockToDate').value = new Date(today.getFullYear(), today.getMonth() + 1, 0).toISOString().split('T')[0];
        renderInventory();
    }
    recallDates();

    function renderInventory() {
        let fromDate = document.getElementById('stockFromDate').value;
        let toDate = document.getElementById('stockToDate').value;
        let tbody = document.getElementById('inventoryTableBody');
        tbody.innerHTML = "";
        
        Object.keys(inventoryData).forEach(material => {
            let baseOpening = inventoryData[material].opening || 0;
            let priorPurchases = 0, priorConsumption = 0, periodPurchases = 0, periodConsumption = 0;

            transactions.forEach(t => {
                if (t.material === material) {
                    if (fromDate && t.date < fromDate) {
                        if (t.type === 'purchase') priorPurchases += t.qty;
                        if (t.type === 'consumption') priorConsumption += t.qty;
                    } else if ((!fromDate || t.date >= fromDate) && (!toDate || t.date <= toDate)) {
                        if (t.type === 'purchase') periodPurchases += t.qty;
                        if (t.type === 'consumption') periodConsumption += t.qty;
                    }
                }
            });

            let openingStock = baseOpening + priorPurchases - priorConsumption;
            let closingStock = (openingStock + periodPurchases) - periodConsumption;

            let row = tbody.insertRow();
            row.innerHTML = `
                <td style="font-weight: 600; text-align: left;">${material}</td>
                <td>${openingStock.toFixed(1)}</td>
                <td style="color: var(--success-color);">+${periodPurchases.toFixed(1)}</td>
                <td style="color: var(--danger-color);">-${periodConsumption.toFixed(1)}</td>
                <td style="font-weight: bold;">${closingStock.toFixed(1)}</td>
                <td><button class="action-btn" onclick="editInv('${material}')">EDIT</button></td>
            `;
        });
    }

    function addNewMaterialType() {
        let name = prompt("ENTER NEW MATERIAL NAME:")?.trim().toUpperCase();
        if(!name || inventoryData[name]) return;
        let opening = parseFloat(prompt("INITIAL STOCK (KG):", "0")) || 0;
        inventoryData[name] = { opening: opening };
        db.collection("mouldingApp").doc("mainData").update({ inventoryData });
    }

    function openPurchaseModal() {
        let keys = Object.keys(inventoryData);
        let mat = prompt(`MATERIAL (${keys.join(", ")}):`, keys[0])?.toUpperCase();
        if(!mat || !inventoryData[mat]) return;
        let qty = parseFloat(prompt("PURCHASE QTY (KG):", "100"));
        let date = prompt("DATE (YYYY-MM-DD):", new Date().toISOString().split('T')[0]);
        if(qty > 0 && date) {
            transactions.push({ date, type: 'purchase', material: mat, qty });
            db.collection("mouldingApp").doc("mainData").update({ transactions, inventoryData });
        }
    }

    function editInv(mat) {
        let op = parseFloat(prompt("NEW OPENING STOCK:", inventoryData[mat].opening));
        if(!isNaN(op)) {
            inventoryData[mat].opening = op;
            db.collection("mouldingApp").doc("mainData").update({ inventoryData });
        }
    }
  </script>
 </body>
</html>
