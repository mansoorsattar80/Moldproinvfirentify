<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moulding ERP System</title>
    <style>
        body { font-family: sans-serif; padding: 10px; background: #f4f7f6; }
        .module { background: white; padding: 15px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { font-size: 16px; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        .form-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    </style>
</head>
<body>

    <!-- 1. MATERIAL INVENTORY -->
    <div class="module">
        <h2>1. MATERIAL INVENTORY (Stock)</h2>
        <input type="text" id="matName" placeholder="Material Name (e.g. Crystal)">
        <input type="number" id="matQty" placeholder="Quantity (kg)">
        <button onclick="addStock()">Add/Update Stock</button>
        <table id="stockTable">
            <thead><tr><th>Material</th><th>Stock (kg)</th></tr></thead>
            <tbody id="stockBody"></tbody>
        </table>
    </div>

    <!-- 2. SHIFT PRODUCTION -->
    <div class="module">
        <h2>2. SHIFT-WISE PRODUCTION</h2>
        <div class="form-row">
            <input type="text" id="operator" placeholder="Operator Name">
            <select id="shift"><option>Morning</option><option>Evening</option><option>Night</option></select>
            <input type="number" id="goodShots" placeholder="Good Shots">
            <input type="number" id="badShots" placeholder="Bad Shots">
            <input type="file" id="prodPhoto" accept="image/*">
            <button onclick="logProduction()">Log Shift Production</button>
        </div>
    </div>

    <!-- 3. BILLING & DEDUCTION -->
    <div class="module">
        <h2>3. BILLING (Auto-Deduct Stock)</h2>
        <select id="billMat"></select>
        <input type="number" id="matUsed" placeholder="Kg to Deduct for Bill">
        <button onclick="processBill()" style="background: #27ae60;">Generate Bill & Deduct</button>
    </div>

<script>
    let inventory = JSON.parse(localStorage.getItem('inventory')) || {};
    
    function addStock() {
        let name = document.getElementById('matName').value;
        let qty = parseFloat(document.getElementById('matQty').value);
        inventory[name] = (inventory[name] || 0) + qty;
        localStorage.setItem('inventory', JSON.stringify(inventory));
        renderInventory();
    }

    function renderInventory() {
        let body = document.getElementById('stockBody');
        let select = document.getElementById('billMat');
        body.innerHTML = ""; select.innerHTML = "";
        for(let key in inventory) {
            body.innerHTML += `<tr><td>${key}</td><td>${inventory[key]}</td></tr>`;
            select.innerHTML += `<option value="${key}">${key}</option>`;
        }
    }

    function processBill() {
        let mat = document.getElementById('billMat').value;
        let used = parseFloat(document.getElementById('matUsed').value);
        if(inventory[mat] >= used) {
            inventory[mat] -= used;
            localStorage.setItem('inventory', JSON.stringify(inventory));
            alert("Bill Generated! Stock Deducted.");
            renderInventory();
        } else {
            alert("Insufficient Stock!");
        }
    }

    function logProduction() {
        alert("Production Logged with Photo evidence!");
        // Logic to store shift data locally would go here
    }

    renderInventory();
</script>
</body>
</html>
