<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moulding Management Software</title>
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-4">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Job Billing & Specs</h5>
                <button class="btn btn-light btn-sm text-primary fw-bold">Logout</button>
            </div>
            <div class="card-body">
                <form id="job-billing-form">
                    <!-- Slip / Job # -->
                    <div class="mb-3">
                        <label for="slipNo" class="form-label">Slip / Job #</label>
                        <input type="text" class="form-control" id="slipNo" value="101">
                    </div>

                    <!-- Item Name -->
                    <div class="mb-3">
                        <label for="itemName" class="form-label">Item Name</label>
                        <input type="text" class="form-control" id="itemName" value="CAP">
                    </div>

                    <!-- Dynamic Assigned Machines Section -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Assigned Machines</label>
                        <div id="machine-container">
                            <!-- Dynamic rows will appear here -->
                        </div>
                        <button type="button" class="btn btn-success btn-sm mt-2" id="add-machine-btn">+ Add Machine</button>
                    </div>

                    <!-- PP Granules Material -->
                    <div class="mb-3">
                        <label for="material" class="form-label">PP Granules Material</label>
                        <input type="text" class="form-control" id="material" value="BLACK PP">
                    </div>

                    <!-- Submit / Test Button -->
                    <button type="submit" class="btn btn-primary w-100">Save Job Specifications</button>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // List of available machines
        const availableMachines = [
            "M/C NO-01",
            "M/C NO-02",
            "M/C NO-06",
            "MACHINE NO 06"
        ];

        // Function to add a new machine row
        function addMachineRow(selectedValue = "") {
            const container = document.getElementById('machine-container');
            
            // Create wrapper row
            const row = document.createElement('div');
            row.className = 'input-group mb-2 machine-row';
            
            // Create select dropdown
            const select = document.createElement('select');
            select.className = 'form-select machine-select';
            
            // Default placeholder option
            const defaultOpt = document.createElement('option');
            defaultOpt.value = "";
            defaultOpt.textContent = "-- Select Machine --";
            defaultOpt.disabled = true;
            if (!selectedValue) defaultOpt.selected = true;
            select.appendChild(defaultOpt);

            // Populate available machines
            availableMachines.forEach(machine => {
                const option = document.createElement('option');
                option.value = machine;
                option.textContent = machine;
                if (machine === selectedValue) {
                    option.selected = true;
                }
                select.appendChild(option);
            });
            
            // Create remove button
            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'btn btn-outline-danger';
            removeBtn.textContent = 'Remove';
            removeBtn.onclick = function() {
                row.remove();
            };
            
            // Assemble row
            row.appendChild(select);
            row.appendChild(removeBtn);
            container.appendChild(row);
        }

        // Event listener for the "Add Machine" button
        document.getElementById('add-machine-btn').addEventListener('click', function() {
            addMachineRow();
        });

        // Add one default row on page load so it's ready to use
        window.addEventListener('DOMContentLoaded', () => {
            addMachineRow("M/C NO-01");
        });

        // Form submission handling to gather selected values
        document.getElementById('job-billing-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const selects = document.querySelectorAll('.machine-select');
            let selectedMachines = [];
            
            selects.forEach(select => {
                if(select.value) {
                    selectedMachines.push(select.value);
                }
            });

            console.log("Saved Machines:", selectedMachines);
            alert("Successfully saved with machines: " + selectedMachines.join(', '));
        });
    </script>
</body>
</html>
